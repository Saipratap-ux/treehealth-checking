<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
  </defs>
  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer glowing pulse circle for AI scan -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#4ade80" stroke-width="4" stroke-dasharray="16 12" opacity="0.5"/>
  <circle cx="256" cy="256" r="170" fill="#166534" opacity="0.4" />
  
  <!-- Stylized Botanical Leaf -->
  <path d="M 370 142 C 340 110, 220 120, 160 210 C 120 270, 130 350, 190 380 C 270 420, 370 340, 380 230 C 382 200, 380 160, 370 142 Z" fill="url(#leafGrad)" />
  
  <!-- Leaf Vein lines -->
  <path d="M 160 380 Q 250 290 360 150" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  <path d="M 230 300 Q 210 260 180 250" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
  <path d="M 270 255 Q 310 240 335 210" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
  <path d="M 305 215 Q 290 185 260 175" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.75"/>

  <!-- AI Pulse nodes -->
  <circle cx="360" cy="150" r="14" fill="#facc15" stroke="#ffffff" stroke-width="4"/>
  <circle cx="160" cy="380" r="12" fill="#38bdf8" stroke="#ffffff" stroke-width="3"/>
  <circle cx="335" cy="210" r="8" fill="#ffffff" />
  <circle cx="180" cy="250" r="8" fill="#ffffff" />
</svg>
